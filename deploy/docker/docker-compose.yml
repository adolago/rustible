# Docker Compose for Rustible Development and Testing
#
# Usage:
#   Development:  docker compose up -d
#   Testing:      docker compose --profile testing up -d
#   Full stack:   docker compose --profile testing --profile monitoring up -d
#   Cleanup:      docker compose down -v
#

networks:
  rustible_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16

volumes:
  rustible_workspace:
  ssh_keys:

services:
  # ============================================================================
  # Rustible CLI Container - Development
  # ============================================================================
  rustible:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: rustible:latest
    container_name: rustible-dev
    networks:
      rustible_network:
        ipv4_address: 172.30.0.2
    volumes:
      - rustible_workspace:/workspace
      - ssh_keys:/home/rustible/.ssh:ro
      - ../../examples:/workspace/examples:ro
    environment:
      - RUST_LOG=info
      - RUSTIBLE_CONFIG=/etc/rustible/config.toml
    working_dir: /workspace
    stdin_open: true
    tty: true
    entrypoint: ["/bin/bash"]

  # ============================================================================
  # Target Hosts for Testing
  # ============================================================================
  target-ubuntu:
    profiles: ["testing"]
    image: ubuntu:24.04
    container_name: rustible-target-ubuntu
    hostname: target-ubuntu
    networks:
      rustible_network:
        ipv4_address: 172.30.1.10
    ports:
      - "127.0.0.1:2231:22"
    command: >
      bash -c "
        sed -i 's/^Components: .*/Components: main/' /etc/apt/sources.list.d/ubuntu.sources &&
        apt-get update &&
        apt-get install -y --no-install-recommends openssh-server sudo python3 &&
        mkdir -p /var/run/sshd &&
        useradd -m -s /bin/bash testuser &&
        echo 'testuser:testpass' | chpasswd &&
        echo 'testuser ALL=(ALL) NOPASSWD:ALL' >> /etc/sudoers &&
        ssh-keygen -A &&
        exec /usr/sbin/sshd -D
      "
    healthcheck:
      # The container installs openssh-server before sshd can listen, so the
      # budget has to cover an apt install on a loaded runner, not just the
      # daemon's start-up. At 30s + 5x5s it was killed at ~50s mid-install.
      # Narrowing apt to main and dropping recommends takes this container from
      # 96 packages / 37.3 MB to 31 / 10.8 MB (and its index from ~20 MB to
      # 5.3 MB); the budget below leaves room for a slow mirror on top. A
      # generous start_period is free: a check that succeeds during it marks
      # the container healthy immediately, so this only costs time when the
      # container really is still installing.
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/22"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 300s

  target-debian:
    profiles: ["testing"]
    image: debian:bookworm-slim
    container_name: rustible-target-debian
    hostname: target-debian
    networks:
      rustible_network:
        ipv4_address: 172.30.1.11
    ports:
      - "127.0.0.1:2232:22"
    command: >
      bash -c "
        apt-get update &&
        apt-get install -y --no-install-recommends openssh-server sudo python3 &&
        mkdir -p /var/run/sshd &&
        useradd -m -s /bin/bash testuser &&
        echo 'testuser:testpass' | chpasswd &&
        echo 'testuser ALL=(ALL) NOPASSWD:ALL' >> /etc/sudoers &&
        ssh-keygen -A &&
        exec /usr/sbin/sshd -D
      "
    healthcheck:
      # Same apt install as the ubuntu target; 10s was never enough for it.
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/22"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 300s

  target-alpine:
    profiles: ["testing"]
    image: alpine:3.19
    container_name: rustible-target-alpine
    hostname: target-alpine
    networks:
      rustible_network:
        ipv4_address: 172.30.1.12
    ports:
      - "127.0.0.1:2233:22"
    command: >
      sh -c "
        apk add --no-cache openssh sudo python3 bash &&
        mkdir -p /var/run/sshd &&
        adduser -D -s /bin/bash testuser &&
        echo 'testuser:testpass' | chpasswd &&
        echo 'testuser ALL=(ALL) NOPASSWD:ALL' >> /etc/sudoers &&
        ssh-keygen -A &&
        exec /usr/sbin/sshd -D
      "
    healthcheck:
      # apk is quicker than apt, but this container still installs openssh
      # before it can answer, so it gets the same budget.
      test: ["CMD", "nc", "-z", "localhost", "22"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 300s

  # ============================================================================
  # Integration Test Runner
  # ============================================================================
  test-runner:
    profiles: ["testing"]
    build:
      context: ../..
      dockerfile: Dockerfile
    image: rustible:latest
    container_name: rustible-test-runner
    networks:
      rustible_network:
        ipv4_address: 172.30.0.3
    volumes:
      - ../../tests:/workspace/tests:ro
      - ../../examples:/workspace/examples:ro
      - ssh_keys:/home/rustible/.ssh
    environment:
      - RUST_LOG=debug
      - RUSTIBLE_HOSTS=target-ubuntu,target-debian,target-alpine
    depends_on:
      target-ubuntu:
        condition: service_healthy
      target-debian:
        condition: service_healthy
      target-alpine:
        condition: service_healthy
    working_dir: /workspace
    entrypoint: ["/usr/local/bin/rustible"]
    command: ["--help"]

  # ============================================================================
  # Monitoring (Optional)
  # ============================================================================
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.48.0
    container_name: rustible-prometheus
    networks:
      rustible_network:
        ipv4_address: 172.30.2.10
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
