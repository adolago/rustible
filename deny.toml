# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/)
#
# CI runs `cargo deny check licenses bans sources` as a hard gate
# (.github/workflows/security.yml). Advisory checking is owned by
# cargo-audit with .cargo/audit.toml, so the [advisories] section here
# exists only for local `cargo deny check` runs and mirrors that file.

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
unmaintained = "all"
unsound = "workspace"
yanked = "warn"
ignore = [
    # RSA timing sidechannel (Marvin Attack) - no fixed release available;
    # transitive via russh/ssh-key. See .cargo/audit.toml for full rationale.
    "RUSTSEC-2023-0071",
    # atty unaligned read - transitive, unmaintained dependency chain.
    "RUSTSEC-2021-0145",
    # idna Punycode issue - transitive via validator/url; we do not parse
    # untrusted URLs from external sources.
    "RUSTSEC-2024-0421",
    # AWS SDK bundled rustls 0.21 / rustls-webpki 0.101.7 (aws feature only) -
    # fix requires the AWS SDK to move onto rustls 0.23. See .cargo/audit.toml.
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
]

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
